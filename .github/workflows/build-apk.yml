name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get
        working-directory: checklist_app_flutter

      - name: Patch light plugin
        run: |
          python -c "
          import os
          path = '/home/runner/.pub-cache/hosted/pub.dev/light-3.0.1/android/build.gradle'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  c = f.read()
              if 'namespace' not in c:
                  c = c.replace('android {', 'android {\n    namespace \"com.github.bruno128.light\"\n')
                  with open(path, 'w') as f:
                      f.write(c)
              print('Patched successfully')
          "

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        working-directory: checklist_app_flutter

      - name: Patch light plugin
        run: |
          python -c "
          import os
          path = '/home/runner/.pub-cache/hosted/pub.dev/light-3.0.1/android/build.gradle'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  c = f.read()
              if 'namespace' not in c:
                  c = c.replace('android {', 'android {\n    namespace \"com.github.bruno128.light\"\n')
                  with open(path, 'w') as f:
                      f.write(c)
              print('Patched successfully')
          "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartphone-checker-apk
          path: checklist_app_flutter/build/app/outputs/flutter-apk/app-release.apk
