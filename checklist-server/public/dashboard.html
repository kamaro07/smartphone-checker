<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desktop Controller - Outlet do Celular</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; margin: 0; color: #333; }
    header { background-color: #d32f2f; color: white; padding: 20px; text-align: center; }
    .container { display: flex; max-width: 1200px; margin: 20px auto; gap: 20px; padding: 0 20px; }
    .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
    .qr-container { text-align: center; }
    #qrcode { margin-top: 20px; max-width: 100%; height: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
    th { background-color: #f8f9fa; color: #d32f2f; }
    .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; }
    .status-ready { background-color: #00c853; }
    .status-installing { background-color: #ff9800; }
    .status-offline { background-color: #9e9e9e; }
  </style>
</head>
<body>
  <header>
    <h1>OUTLET DO CELULAR - CONTROLLER</h1>
  </header>
  
  <div class="container">
    <!-- Lista de Aparelhos -->
    <div class="panel" style="flex: 2;">
      <h2>Dispositivos Conectados (USB & Wi-Fi)</h2>
      <table>
        <thead>
          <tr>
            <th>ID / IMEI</th>
            <th>Modelo</th>
            <th>SO</th>
            <th>Conexão</th>
            <th>Status do App</th>
          </tr>
        </thead>
        <tbody id="devices-table">
          <!-- Renderizado via JS -->
        </tbody>
      </table>
    </div>

    <!-- QR Code de Onboarding -->
    <div class="panel qr-container">
      <h2>Instalação via Wi-Fi</h2>
      <p>Aponte a câmera do celular para baixar o App Profiler instantaneamente.</p>
      <img id="qrcode" src="" alt="QR Code">
    </div>
  </div>

  <script>
    async function fetchDevices() {
      try {
        const response = await fetch('/api/devices');
        const data = await response.json();
        
        const table = document.getElementById('devices-table');
        table.innerHTML = '';
        
        Object.keys(data.devices).forEach(id => {
          const device = data.devices[id];
          const tr = document.createElement('tr');
          
          let statusClass = 'status-offline';
          let statusText = device.status;
          if (device.status === 'Pronto (Ping Wi-Fi)' || device.status === 'App Instalado') {
            statusClass = 'status-ready';
          } else if (device.status === 'Instalando...') {
            statusClass = 'status-installing';
          }

          tr.innerHTML = `
            <td>${device.id}</td>
            <td>${device.model || 'Desconhecido'}</td>
            <td>${device.os} ${device.osVersion || ''}</td>
            <td>${device.connectionType}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          `;
          table.appendChild(tr);
        });
      } catch (error) {
        console.error('Erro ao buscar dispositivos:', error);
      }
    }

    async function fetchQR() {
      try {
        const response = await fetch('/api/qrcode');
        const data = await response.json();
        document.getElementById('qrcode').src = data.qrCodeUrl;
      } catch (error) {
        console.error('Erro ao gerar QR:', error);
      }
    }

    fetchQR();
    fetchDevices();
    setInterval(fetchDevices, 3000); // Atualiza a cada 3 segundos
  </script>
</body>
</html>
